name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1 -- Code Quality Checks (Python & Prettier)
  # ============================================================
  code_quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install autoflake black==25.11.0

      - name: Check Python Code Quality
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Running autoflake check ==="
          autoflake --remove-all-unused-imports --remove-unused-variables --recursive --check .
          echo "=== Running black check ==="
          black . --check

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Global Formatters
        run: npm install -g prettier prettier-plugin-solidity

      - name: Run Global Prettier Check
        shell: bash
        run: |
          set -euo pipefail
          NODE_GLOBAL=$(npm root -g)
          echo "=== Running Prettier check ==="
          prettier --plugin="$NODE_GLOBAL/prettier-plugin-solidity/dist/index.js" \
            --check "**/*.{js,jsx,ts,tsx,json,html,css,md,sol,yml,yaml}"

  # ===================================================================
  # Job 2 -- Backend Test & Build (Pytest + Docker image + smoke test)
  # ===================================================================
  backend_test_build:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    env:
      BACKEND_DIR: code/backend
      IMAGE_TAG: optionix-backend:ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f "${BACKEND_DIR}/requirements.txt" ]; then
            python -m pip install -r "${BACKEND_DIR}/requirements.txt"
          fi
          python -m pip install pytest pytest-cov pytest-asyncio

      - name: Run backend test suite
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --tb=short \
            --strict-markers \
            -v \
            --cov=. \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: code/backend/coverage.xml
          retention-days: 30

      - name: Compute build metadata
        id: meta
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: code
          file: code/backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VCS_REF=${{ github.sha }}
            VERSION=ci-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container runs as non-root
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id "${IMAGE_TAG}" -u)
          echo "Container user id: ${uid}"
          test "${uid}" != "0"

      - name: Smoke test image (app, pricing engine, model artifacts)
        env:
          SMOKE_SECRET_KEY: ci-smoke-secret-key-with-at-least-32-chars
          SMOKE_ENCRYPTION_KEY: CiSmokeEncryptionKey1234567890!!
        run: |
          set -euo pipefail
          docker run --rm -i --entrypoint python \
            -e ENVIRONMENT=testing \
            -e TESTING=true \
            -e SECRET_KEY="${SMOKE_SECRET_KEY}" \
            -e ENCRYPTION_KEY="${SMOKE_ENCRYPTION_KEY}" \
            -e DATABASE_URL=sqlite:////tmp/smoke.db \
            "${IMAGE_TAG}" - <<'PY'
          from app.main import app
          from app.services.model_service import get_model_service
          from app.services.pricing_engine import PricingEngine

          info = get_model_service().get_model_info()
          assert info["model_available"] and not info["fallback_active"], info
          assert info["artifact_dir"] == "/app/ai_models/artifacts", info["artifact_dir"]

          price = PricingEngine().price(100, 100, 1, 0.05, 0.2)["price"]
          assert abs(price - 10.4506) < 1e-3, price

          paths = {route.path for route in app.routes}
          required = {
              "/analytics/price",
              "/analytics/calibrate",
              "/market/volatility",
              "/market/model-info",
              "/risk/var",
              "/health",
          }
          missing = required - paths
          assert not missing, missing
          print("smoke test passed", info["model_version"], round(price, 4))
          PY

      - name: Export image
        run: docker save "${IMAGE_TAG}" | gzip > backend-image.tar.gz

      - name: Upload backend image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar.gz
          retention-days: 7

  # ============================================================
  # Job 3 -- AI Models Test & Validation (Pytest + coverage)
  # ============================================================
  ai_models_test:
    name: AI Models Test & Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 45

    env:
      AI_MODELS_DIR: code/ai_models
      # ai_models is imported as a top-level package, so code/ must be on the path.
      PYTHONPATH: ${{ github.workspace }}/code

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            code/ai_models/requirements.txt
            code/ai_models/requirements-dev.txt

      # requirements-dev.txt extends the pinned requirements.txt with matplotlib,
      # pytest and pyflakes.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r "${AI_MODELS_DIR}/requirements-dev.txt"
          python -m pip install pytest-cov

      - name: Byte-compile all ai_models sources
        run: |
          set -euo pipefail
          echo "=== Compiling models, quantitative, volatility, training and tests ==="
          python -m compileall -q "${AI_MODELS_DIR}"

      - name: Verify public API and sub-packages import cleanly
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib

          import ai_models

          for name in ai_models.__all__:
              getattr(ai_models, name)
              print(f"OK   ai_models.{name}")

          for module in (
              "config",
              "models",
              "models.fraud_model",
              "models.service",
              "models.volatility_model",
              "quantitative",
              "quantitative.black_scholes",
              "quantitative.monte_carlo",
              "quantitative.advanced",
              "quantitative.advanced.calibration_engine",
              "quantitative.advanced.local_volatility",
              "quantitative.advanced.stochastic_volatility",
              "quantitative.advanced.volatility_surface",
              "volatility.artifacts",
              "volatility.dataset",
              "volatility.features",
              "volatility.inference",
              "volatility.training",
              "training.data_preprocessing",
              "training.generate_artifacts",
              "training.synthetic",
              "training.train_volatility_model",
          ):
              importlib.import_module(f"ai_models.{module}")
              print(f"OK   ai_models.{module}")
          print(f"ai_models {ai_models.__version__} imports cleanly")
          PY

      - name: Run ai_models test suite
        working-directory: ${{ env.AI_MODELS_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --cov=ai_models \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml

      - name: Upload ai_models coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-models-coverage-report
          path: code/ai_models/coverage.xml
          if-no-files-found: ignore
          retention-days: 30

  # ============================================================
  # Job 4 -- Web Frontend Test & Build
  # ============================================================
  web-frontend_test_and_build:
    name: Web-Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: web-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        run: CI=true npm test

      - name: Build web-frontend
        run: CI=false npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web-frontend/dist/
          retention-days: 7

  # ============================================================
  # Job 5 -- Mobile Frontend (Expo) Test & Build
  # ============================================================
  mobile_frontend:
    name: Mobile-Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: mobile-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Mobile Tests
        run: npm run test:ci

      - name: Build Mobile Web Export
        run: CI=false npm run build:web

      - name: Upload Mobile Web Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-dist
          path: mobile-frontend/dist/
          retention-days: 7

  # ============================================================
  # Job 6 -- Smart Contract Compilation & Tests (Hardhat)
  # ============================================================
  blockchain_tests:
    name: Smart Contract Compile & Test
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: code/blockchain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: code/blockchain/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile smart contracts
        run: npm run compile

      - name: Run smart contract test suite
        run: npm test

      - name: Lint contracts (solhint)
        run: npm run lint

      - name: Export ABI
        run: npm run export-abi

      - name: Upload compiled contract ABI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockchain-contract-abi
          path: code/blockchain/abi/
          retention-days: 30
