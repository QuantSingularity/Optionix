# Default values for the optionix chart.
# Environment-specific overrides live in environments/{dev,staging,prod}/values.yaml
# and are applied on top of these via `helm install -f environments/<env>/values.yaml`.

appName: optionix
environment: dev
namespace: optionix
logLevel: debug
imagePullSecrets: regcred

backend:
  replicas: 2
  image:
    repository: registry.example.com/app/backend
    tag: latest
    pullPolicy: Always
  containerPort: 8000
  servicePort: 8000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  apiUrl: http://app-backend
  jwtSecret: CHANGE_ME_JWT_SECRET
  apiKey: CHANGE_ME_API_KEY
  encryptionKey: CHANGE_ME_32_CHAR_KEY_HERE_XXXX
  version: latest

frontend:
  replicas: 2
  image:
    repository: registry.example.com/app/frontend
    tag: latest
    pullPolicy: Always
  # nginx runs as a non-root user in this image and therefore can't bind
  # to a privileged port (<1024) - it listens on 3000, not 80. Keep this in
  # sync with web-frontend/nginx.conf's `listen` directive and
  # Dockerfile.frontend's EXPOSE.
  containerPort: 3000
  servicePort: 80
  apiUrl: /api
  service:
    type: ClusterIP
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

database:
  replicas: 1
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  containerPort: 3306
  servicePort: 3306
  name: optionixdb
  user: appuser
  password: CHANGE_ME_DB_PASSWORD
  rootPassword: CHANGE_ME_DB_ROOT_PASSWORD
  storageClass: standard
  storage: 10Gi
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  backupStorageClass: standard
  backupStorage: 20Gi

redis:
  replicas: 1
  image:
    repository: redis
    tag: "7.2"
    pullPolicy: IfNotPresent
  containerPort: 6379
  servicePort: 6379
  storageClass: standard
  storage: 5Gi
  resources:
    limits:
      cpu: 300m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  password: CHANGE_ME_REDIS_PASSWORD
  maxmemory: 256mb

ingress:
  host: dev.optionix.example.com
  class: nginx
  sslRedirect: "true"
  certManager:
    issuer: letsencrypt-staging

monitoring:
  prometheus:
    storageClass: standard
    storage: 20Gi
  grafana:
    storageClass: standard
    storage: 5Gi
    adminPassword: CHANGE_ME_GRAFANA_PASSWORD

logging:
  elasticsearch:
    password: CHANGE_ME_ES_PASSWORD
