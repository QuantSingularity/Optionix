apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # Prometheus's own metrics
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # node-exporter runs with hostNetwork: true, so it's discovered via
      # the "node" role rather than a Service.
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__address__]
            regex: "(.*):10250"
            replacement: "${1}:9100"
            target_label: __address__

      # Optionix backend + MySQL exporter sidecar, and anything else that
      # opts in via prometheus.io/scrape annotations (matches
      # backend-deployment.yaml and database-statefulset.yaml).
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels:
              [
                __address__,
                __meta_kubernetes_pod_annotation_prometheus_io_port,
              ]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: "${1}:${2}"
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: monitoring
  labels:
    app: grafana
data:
  # Auto-provisions the Prometheus datasource on startup so it doesn't
  # need to be configured manually through the UI. Grafana loads every
  # *.yaml file under /etc/grafana/provisioning/datasources/ (which is
  # exactly where this ConfigMap is mounted in monitoring-stack.yaml).
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
