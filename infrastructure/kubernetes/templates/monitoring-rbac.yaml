# ServiceAccounts and RBAC for the monitoring stack.
#
# monitoring-stack.yaml's Deployments/DaemonSet/StatefulSet all reference a
# serviceAccountName, but none of these ServiceAccounts were ever actually
# defined - the ServiceAccount admission controller (on by default in every
# mainstream cluster) rejects pod creation when the referenced
# ServiceAccount doesn't exist in the pod's namespace.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring

---
# Prometheus discovers scrape targets via the Kubernetes API
# (kubernetes_sd_configs in prometheus-config, see monitoring-config.yaml),
# which needs cluster-wide read access to nodes/pods/services/endpoints.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: monitoring

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-exporter
  namespace: monitoring

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elasticsearch
  namespace: logging
