apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Values.appName }}-config"
  namespace: "{{ .Values.namespace }}"
  labels:
    app: "{{ .Values.appName }}"
data:
  API_URL: "{{ .Values.backend.apiUrl }}"
  LOG_LEVEL: "{{ .Values.logLevel }}"
  ENVIRONMENT: "{{ .Values.environment }}"
  DATABASE_POOL_SIZE: "20"
  DATABASE_MAX_OVERFLOW: "30"
