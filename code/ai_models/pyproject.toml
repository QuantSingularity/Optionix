[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optionix-ai-models"
version = "2.1.0"
description = "Quantitative pricing, calibration and volatility forecasting models for Optionix"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.13",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8.3", "ruff>=0.6", "pyflakes>=3.2"]

[tool.setuptools]
package-dir = { "ai_models" = "." }
packages = [
    "ai_models",
    "ai_models.quantitative",
    "ai_models.quantitative.advanced",
    "ai_models.volatility",
    "ai_models.models",
    "ai_models.training",
]

[tool.setuptools.package-data]
ai_models = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --no-header -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E741"]
